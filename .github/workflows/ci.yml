name: EletroKanban CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: eletrokanban
          POSTGRES_USER: eletrokanban
          POSTGRES_PASSWORD: eletrokanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar Dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Rodar Testes do Backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: eletrokanban
          DB_USER: eletrokanban
          DB_PASSWORD: eletrokanban
        run: |
          python backend/manage.py test accounts --settings=config.settings

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build do Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
