services:
  postgres:
    image: postgres:18.6-alpine
    container_name: eletrokanban_db
    restart: always
    environment:
      POSTGRES_DB: eletrokanban
      POSTGRES_USER: eletrokanban
      POSTGRES_PASSWORD: eletrokanban
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
